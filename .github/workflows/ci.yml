name: TenderCouncil checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Resolve and print pinned direct-test runtime
        env:
          TENDERCOUNCIL_DIRECT_GENVM_VERSION: v0.2.16
        run: python tools/ci_diagnostics.py --resolve
      - run: genvm-lint check contracts/tender_council.py
      - run: genvm-lint validate contracts/tender_council.py
      - name: Print resolved runtime and run all direct tests
        run: |
          python tools/ci_diagnostics.py
          python -m pytest
