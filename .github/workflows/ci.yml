name: TenderCouncil checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Resolve and print pinned direct-test runtime
        env:
          TENDERCOUNCIL_DIRECT_GENVM_VERSION: v0.2.16
        run: python tools/ci_diagnostics.py --resolve
      - run: genvm-lint check contracts/tender_council.py
      - run: genvm-lint validate contracts/tender_council.py
      - run: genvm-lint check contracts/tender_council_production.py
      - run: genvm-lint validate contracts/tender_council_production.py
      - run: genvm-lint check contracts/tender_council_core.py
      - run: genvm-lint validate contracts/tender_council_core.py
      - run: genvm-lint check contracts/tender_council_evaluator.py
      - run: genvm-lint validate contracts/tender_council_evaluator.py
      - name: Generate and check split artifacts
        run: |
          python tools/make_deployable.py contracts/tender_council_core.py artifacts/tender_council_core_deployable.py
          python tools/make_deployable.py contracts/tender_council_evaluator.py artifacts/tender_council_evaluator_deployable.py
          python tools/split_size_check.py
      - name: Print resolved runtime and run all direct tests
        run: |
          python tools/ci_diagnostics.py
          python -m pytest
      - name: Run security mutation checks
        run: python tools/mutation_test.py
      - name: Run split security mutation checks
        run: python tools/split_mutation_test.py
