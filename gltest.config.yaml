networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"
    leader_only: false

  studionet: {}

paths:
  contracts: "contracts"
  # gltest recursively clears this directory at pytest session start. Keep its
  # ephemeral output isolated from the append-only production evidence in
  # artifacts/.
  artifacts: ".local/gltest-artifacts"

environment: .env
